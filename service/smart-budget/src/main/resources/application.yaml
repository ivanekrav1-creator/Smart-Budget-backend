spring:
  application:
    name: smart-budget
  datasource:
    url: jdbc:postgresql://localhost:5432/smart-budget
    username: postgres
    password: "0011"
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumers:
      transaction-consumer:
        group-id: "transaction-consumer"
        auto-offset-reset: latest
        topic: transactions
        retry-interval: 1000
        retry-attempts: 2
        concurrency: 1
  mail:
    host: smtp.gmail.com
    port: 587
    username: ivanekrav1@gmail.com
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
smart:
  budget:
    notification-interval: 5m
    mail-from: Smart Budget <${spring.mail.username}>
    notification-threshold-percent: 80