name: github-actions.yml
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-build-cache

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for smart-budget
        id: meta-consumer
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/smart-budget

      - name: Build and push smart-budget image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: consumer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-consumer.outputs.tags }}
          annotations: ${{ steps.meta-consumer.outputs.annotations }}
          provenance: true
          sbom: true

      - name: Extract metadata for mock-producer
        id: meta-producer
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/mock-producer

      - name: Build and push mock-producer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: producer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-producer.outputs.tags }}
          annotations: ${{ steps.meta-producer.outputs.annotations }}
          provenance: true
          sbom: true